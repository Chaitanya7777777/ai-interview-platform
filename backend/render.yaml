# Render deployment configuration for the FastAPI backend.
# Docs: https://render.com/docs/yaml-spec
#
# USAGE:
#   1. Push this file to the root of your repository (or backend/ folder).
#   2. In Render dashboard → New → Blueprint → point to this repo.
#   3. Render reads this file and creates the service automatically.
#
# Alternative (manual setup):
#   New → Web Service → Connect repo → set the fields below manually.

services:
  - type: web
    name: resume-analyser-api
    runtime: python
    region: oregon            # or frankfurt, singapore — pick closest to your users
    plan: free                # upgrade to starter ($7/mo) for always-on service
    rootDir: backend          # the subdirectory containing requirements.txt

    buildCommand: pip install -r requirements.txt

    # Render sets PORT automatically. Uvicorn must bind to 0.0.0.0:$PORT.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    # Health check — Render pings this to know if the deploy succeeded.
    healthCheckPath: /health

    envVars:
      # ── Required secrets — set these in Render Dashboard → Environment ──────
      # Do NOT put real values here. This file is committed to source control.
      - key: DATABASE_URL
        sync: false          # "sync: false" means Render will prompt you to fill it in

      - key: SUPABASE_JWT_SECRET
        sync: false

      - key: GROQ_API_KEY
        sync: false

      # ── Optional overrides ─────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production

      - key: AI_PROVIDER
        value: groq

      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      # Comma-separated list — add your Vercel URL here after first deploy
      # Example: https://resume-analyser-abc123.vercel.app,http://localhost:3000
      - key: CORS_ORIGINS
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
